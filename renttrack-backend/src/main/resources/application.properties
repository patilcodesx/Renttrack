# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/renttrack_v2
spring.datasource.username=postgres
spring.datasource.password=NewStrongPassword123

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Disable open-in-view
# ===============================
spring.jpa.open-in-view=false

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG

jwt.secret=Z2VuZXJhdGVkX3JlbnR0cmFja19qd3Rfc2VjcmV0X2tleV9mb3Jfc3ByaW5nX2Jvb3RfMjAyNg==
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


