<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 30px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #DC2626; color: white; padding: 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; }
    .body { padding: 30px; color: #333; }
    .overdue-box { background: #FEE2E2; border-left: 4px solid #DC2626; padding: 16px 20px; margin: 20px 0; border-radius: 4px; }
    .amount { font-size: 28px; font-weight: bold; color: #DC2626; }
    .btn { display: inline-block; background: #DC2626; color: white; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; margin: 20px 0; }
    .footer { background: #f4f4f4; padding: 20px; text-align: center; color: #888; font-size: 12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚠️ Overdue Payment Notice</h1>
  </div>
  <div class="body">
    <p>Dear <strong th:text="${tenantName}">Tenant</strong>,</p>
    <p>Your rent payment is <strong th:text="${daysLate}">5</strong> day(s) overdue. Please pay immediately.</p>
    <div class="overdue-box">
      <div>Overdue Amount</div>
      <div class="amount" th:text="${amount}">₹10,000</div>
      <div>Was due on: <strong th:text="${dueDate}">01 Jan 2025</strong></div>
      <div>Days late: <strong th:text="${daysLate}">5</strong></div>
    </div>
    <a th:href="${paymentLink}" class="btn">Pay Now</a>
  </div>
  <div class="footer">
    <p>© <span th:text="${appName}">RentTrack</span></p>
  </div>
</div>
</body>
</html>
