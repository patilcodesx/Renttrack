<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 30px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #1E40AF; color: white; padding: 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 22px; }
    .body { padding: 30px; color: #333; }
    .btn { display: inline-block; background: #1E40AF; color: white; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; margin: 20px 0; }
    .note { color: #888; font-size: 13px; margin-top: 20px; }
    .footer { background: #f4f4f4; padding: 20px; text-align: center; color: #888; font-size: 12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔐 Password Reset Request</h1>
  </div>
  <div class="body">
    <p>Hi <strong th:text="${name}">User</strong>,</p>
    <p>We received a request to reset your RentTrack password. Click the button below to set a new password:</p>
    <a th:href="${resetLink}" class="btn">Reset Password</a>
    <p class="note">This link expires in <strong>1 hour</strong>. If you didn't request a password reset, you can safely ignore this email.</p>
  </div>
  <div class="footer">
    <p>© <span th:text="${appName}">RentTrack</span> — Automated Rent Management</p>
  </div>
</div>
</body>
</html>
