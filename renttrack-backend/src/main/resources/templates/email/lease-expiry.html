<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 30px auto; background: white; border-radius: 8px; overflow: hidden; }
    .header { background: #D97706; color: white; padding: 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; }
    .body { padding: 30px; color: #333; }
    .expiry-box { background: #FEF3C7; border-left: 4px solid #D97706; padding: 16px 20px; margin: 20px 0; border-radius: 4px; }
    .days { font-size: 36px; font-weight: bold; color: #D97706; }
    .footer { background: #f4f4f4; padding: 20px; text-align: center; color: #888; font-size: 12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 Lease Expiry Notice</h1>
  </div>
  <div class="body">
    <p>Dear <strong th:text="${tenantName}">Tenant</strong>,</p>
    <p>Your lease for unit <strong th:text="${unitNumber}">A-101</strong> is expiring soon.</p>
    <div class="expiry-box">
      <div>Days Remaining</div>
      <div class="days" th:text="${daysLeft}">30</div>
      <div>Lease expires on: <strong th:text="${expiryDate}">31 Jan 2025</strong></div>
    </div>
    <p>Please contact your landlord to discuss renewal options.</p>
  </div>
  <div class="footer">
    <p>© <span th:text="${appName}">RentTrack</span></p>
  </div>
</div>
</body>
</html>
