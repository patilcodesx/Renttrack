name: RentTrack CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Backend ----------
      - name: Build backend
        run: |
          cd backend
          ./mvnw clean package -DskipTests

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build -t yourdockerhub/renttrack-backend:latest backend

      - name: Push backend image
        run: |
          docker push yourdockerhub/renttrack-backend:latest

      # ---------- Frontend ----------
      - name: Build frontend image
        run: |
          docker build -t yourdockerhub/renttrack-frontend:latest frontend

      - name: Push frontend image
        run: |
          docker push yourdockerhub/renttrack-frontend:latest
