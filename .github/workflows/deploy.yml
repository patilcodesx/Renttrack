name: RentTrack CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout repository
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ============================
      # BACKEND BUILD
      # ============================
      - name: Build backend
        run: |
          cd renttrack-backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests


      # ============================
      # DOCKER LOGIN
      # ============================
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ============================
      # BACKEND IMAGE
      # ============================
      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/renttrack-backend:latest \
            ./renttrack-backend

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/renttrack-backend:latest


      # ============================
      # FRONTEND IMAGE
      # ============================
      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/renttrack-frontend:latest \
            ./renttrack-frontend-suite-main

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/renttrack-frontend:latest
